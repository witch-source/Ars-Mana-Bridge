plugins {
    id 'java'
    id 'net.neoforged.moddev' version '2.0.42-beta'
}

group = 'com.example'
version = '1.0.0'

base {
    archivesName = 'arsmanabridge'
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(21)
}

neoForge {
    version = "21.1.172"

    parchment {
        mappingsVersion = "2024.11.17"
        minecraftVersion = "1.21.1"
    }

    mods {
        arsmanabridge {
            sourceSet sourceSets.main
        }
    }
}

repositories {
    // CurseMaven for mod dependencies
    maven {
        url "https://www.cursemaven.com"
        content {
            includeGroup "curse.maven"
        }
    }
    maven {
        url "https://api.modrinth.com/maven"
        content {
            includeGroup "maven.modrinth"
        }
    }
}

dependencies {
    // Ars Nouveau 1.21.1 - update file ID to latest
    // Find current file ID at: https://www.curseforge.com/minecraft/mc-mods/ars-nouveau/files
    compileOnly "curse.maven:ars-nouveau-401955:8152094"

    // Iron's Spells 'n Spellbooks 1.21.1 - update file ID to latest
    // Find current file ID at: https://www.curseforge.com/minecraft/mc-mods/irons-spells-n-spellbooks/files
    compileOnly "curse.maven:irons-spells-n-spellbooks-855414:7907341"
}

// Include mixin annotation processor
configurations {
    annotationProcessor
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

jar {
    manifest {
        attributes([
            'MixinConfigs': 'arsmanabridge.mixins.json'
        ])
    }
}
