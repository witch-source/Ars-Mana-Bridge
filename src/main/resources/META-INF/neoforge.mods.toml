modLoader = "javafml"
loaderVersion = "[4,)"
license = "MIT"

[[mods]]
modId = "arsmanabridge"
version = "1.0.0"
displayName = "Ars Mana Bridge"
description = '''
Unifies the mana systems of Ars Nouveau and Iron's Spells 'n Spellbooks.
In ISS_PRIMARY mode (default): Iron's mana pool is used for all spells.
In ARS_PRIMARY mode: Ars Nouveau mana pool is used for all spells.
Iron's spell power attributes apply to Ars Nouveau spell damage.
Supports Ars Elemental and Ars Technomancy elemental scaling.
'''

[[dependencies.arsmanabridge]]
    modId = "neoforge"
    type = "required"
    versionRange = "[21.1,)"
    ordering = "NONE"
    side = "BOTH"

[[dependencies.arsmanabridge]]
    modId = "minecraft"
    type = "required"
    versionRange = "[1.21.1,1.21.2)"
    ordering = "NONE"
    side = "BOTH"

[[dependencies.arsmanabridge]]
    modId = "ars_nouveau"
    type = "required"
    versionRange = "[5.0.0,)"
    ordering = "AFTER"
    side = "BOTH"

[[dependencies.arsmanabridge]]
    modId = "irons_spellbooks"
    type = "required"
    versionRange = "[1.21.1-3.0.0,)"
    ordering = "AFTER"
    side = "BOTH"

[[dependencies.arsmanabridge]]
    modId = "ars_elemental"
    type = "optional"
    versionRange = "[*,)"
    ordering = "AFTER"
    side = "BOTH"

[[dependencies.arsmanabridge]]
    modId = "ars_technomancy"
    type = "optional"
    versionRange = "[*,)"
    ordering = "AFTER"
    side = "BOTH"

[[mixins]]
config = "arsmanabridge.mixins.json"
